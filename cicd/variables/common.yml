# Values that are the same for every environment.
# Nothing here is a secret. Identifiers of the subscription and of identities are NOT kept in the
# repository: they are pipeline variables, set in Azure DevOps (see azure-pipelines.yml, top).

variables:
  # The Azure DevOps service connections the pipeline signs in to Azure with - one per
  # environment, so that nothing that can deploy to dev can deploy to prod. Each is a managed
  # identity trusted through a federated credential: there is no password.
  devServiceConnection: sc-olist-dev
  prodServiceConnection: sc-olist-prod

  # The Azure Databricks workspace (one workspace; dev and prod are separated by catalog,
  # service principal and storage account).
  databricksHost: https://adb-7405615162316092.12.azuredatabricks.net

  # The names of the ARM template parameters that carry the values which differ between dev and
  # prod. The build fails if one of them is not in the generated template (cicd/scripts/
  # check-arm-parameters.ps1), because an environment would then silently keep the value that is
  # written in the repository's files (dev's).
  armParamStorageUrl: ls_adls_lake_properties_typeProperties_url
  armParamKeyVaultUrl: ls_kv_properties_typeProperties_baseUrl
  armParamSqlServer: ls_azuresql_control_properties_typeProperties_server
  armParamSqlDatabase: ls_azuresql_control_properties_typeProperties_database
  armParamJobId: default_properties_gp_databricks_job_id_value

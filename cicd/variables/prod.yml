# The prod environment: the names of its resources. Nothing here is a secret.
# Together with cicd/variables/dev.yml these are the only values that differ between the two
# environments; everything else in the repository is the same for both.

variables:
  prodResourceGroup: rg-olist-prod
  prodLocation: centralindia
  prodFactoryName: adf-olist-prod-bd
  prodStorageAccount: stolistprodbd
  prodKeyVault: kv-olist-prod-bd
  prodSqlServer: sql-olist-prod-bd
  prodSqlDatabase: sqldb-olist-control

# =====================================================================================
# Olist E-commerce Lakehouse on Azure - the deployment pipeline (Azure DevOps)
# -------------------------------------------------------------------------------------
# WHAT IT DOES
#   On every pull request into main : stage "build" only  - nothing is deployed.
#   On every merge into main        : build -> deploy_dev -> deploy_prod.
#                                     deploy_prod waits for a person's approval
#                                     (environment olist-prod).
#
#   build        1. Data Factory: validates every file under adf/ (the same check as
#                   "Validate all") and generates the factory's ARM template - the package
#                   that is deployed. Nobody presses Publish.
#                2. Fails if a value that must differ between environments is not a
#                   parameter of that template (an environment would silently keep the
#                   value written in the repository).
#                3. Databricks: validates the bundle (the job, its cluster, its notebooks).
#                4. Monitoring: builds monitoring/alerts.bicep (the failure alert) - a syntax and
#                   type check; nothing is deployed by the build.
#
#   deploy_dev   The package goes to dev.  } The same steps, from one template:
#   deploy_prod  The same package goes to  } cicd/templates/deploy-environment.yml.
#                prod, after approval.     } Only the environment's values differ. Each
#                                          } deployment also creates or updates the alert.
#
#   No step starts a cluster or runs a job. Deploying costs nothing in compute.
#
# WHAT DIFFERS BETWEEN DEV AND PROD - and nothing else does
#   cicd/variables/dev.yml, cicd/variables/prod.yml : the names of each environment's resources,
#                                                     its Databricks workspace among them.
#   Pipeline variables (set in Azure DevOps):
#     subscriptionId    - the Azure subscription (Data Factory's own files under adf/ also carry it,
#                         inside resource ids)
#     devRunAsSpAppId   - Application ID of the service principal the dev job runs as
#     prodRunAsSpAppId  - Application ID of the service principal the prod job runs as
#     alertEmail        - SECRET: the mail address the failure alert is sent to
#                         (monitoring/alerts.bicep); never written in this repository
#
# HOW IT SIGNS IN
#   Through the service connections named in cicd/variables/common.yml, one per environment:
#   each is a user-assigned managed identity that trusts this Azure DevOps project (workload
#   identity federation) and has rights on its own environment only. The build signs in as
#   dev's identity, so a pull request can never reach prod. There is no password, key or
#   token in this repository or in the pipeline.
# =====================================================================================

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  - template: cicd/variables/common.yml
  - template: cicd/variables/dev.yml
  - template: cicd/variables/prod.yml

# Every job runs on a Microsoft-hosted Ubuntu machine: nothing is installed anywhere, and the
# machine is thrown away after the job. (A team with resources inside a private network would
# name a self-hosted agent pool here instead.)
# The image is named by its version, not as "ubuntu-latest": "latest" is moved to a newer
# Ubuntu by Microsoft on a date of its choosing, and a deployment must not change because the
# machine under it did. Moving to a newer image is a pull request like any other change.
pool:
  vmImage: ubuntu-24.04

stages:
  # ===================================================================================
  - stage: build
    displayName: Build - validate, and pack the factory
    jobs:
      - job: adf
        displayName: Data Factory - validate and generate the ARM template
        steps:
          # Node.js on an LTS line (cicd/variables/common.yml), as Microsoft's build package asks.
          - task: UseNode@1
            displayName: Install Node.js (LTS)
            inputs:
              version: $(nodeVersion)

          # "ci" installs exactly what package-lock.json lists: the same package on every run.
          - task: Npm@1
            displayName: Install Microsoft's Data Factory build package
            inputs:
              command: ci
              workingDir: $(Build.Repository.LocalPath)/cicd/adf-build

          # "export" validates first, then writes the template to cicd/adf-build/ArmTemplate.
          # This is what the Publish button does in the Data Factory editor.
          - task: Npm@1
            displayName: Validate the factory and generate its ARM template
            inputs:
              command: custom
              workingDir: $(Build.Repository.LocalPath)/cicd/adf-build
              customCommand: run build export $(Build.Repository.LocalPath)/adf $(devFactoryId) "ArmTemplate"

          - pwsh: |
              & "$(Build.Repository.LocalPath)/cicd/scripts/check-arm-parameters.ps1" `
                  -ParametersFile "$(Build.Repository.LocalPath)/cicd/adf-build/ArmTemplate/ARMTemplateParametersForFactory.json" `
                  -Required '$(armParamStorageUrl)', '$(armParamKeyVaultUrl)', '$(armParamSqlServer)', '$(armParamSqlDatabase)', '$(armParamJobId)', '$(armParamDatabricksDomain)', '$(armParamDatabricksWorkspaceId)'
            displayName: Check that every dev-or-prod value is a template parameter

          - task: PublishPipelineArtifact@1
            displayName: Publish the template as the artifact adf-arm
            inputs:
              targetPath: $(Build.Repository.LocalPath)/cicd/adf-build/ArmTemplate
              artifact: adf-arm
              publishLocation: pipeline

      - job: bundle
        displayName: Databricks - validate the bundle
        steps:
          # The install script of one release tag installs exactly that CLI version (cicd/variables/common.yml).
          - script: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/$(databricksCliVersion)/install.sh | sh
            displayName: Install the Databricks CLI (pinned)
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'))

          # The Databricks CLI signs in through the Azure CLI, which this task has signed in as
          # dev's deployment identity. The job's definition is the same for both targets, so
          # validating the dev target checks it; prod's values are checked when prod is deployed.
          # addSpnToEnvironment hands the script the Application ID of the identity it is signed
          # in as (servicePrincipalId) - the bundle names that identity in its permissions.
          - task: AzureCLI@2
            displayName: databricks bundle validate (target dev)
            inputs:
              azureSubscription: ${{ variables.devServiceConnection }}
              useGlobalConfig: true
              addSpnToEnvironment: true
              scriptType: pscore
              scriptLocation: inlineScript
              workingDirectory: $(Build.Repository.LocalPath)/databricks
              inlineScript: |
                $env:DATABRICKS_HOST = '$(devDatabricksHost)'
                databricks bundle validate -t dev --var="storage_account=$(devStorageAccount)" --var="run_as_sp=$(devRunAsSpAppId)" --var="deploy_sp=$env:servicePrincipalId"
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - job: monitoring
        displayName: Monitoring - build the failure alert's template
        steps:
          # Compiles the Bicep file to an ARM template: a wrong property, type or resource name
          # fails here, on the pull request, before anything reaches dev. Needs no sign-in.
          # The pinned Bicep (cicd/variables/common.yml), not whichever one the agent image carries.
          - script: |
              set -e
              az config set bicep.use_binary_from_path=false
              az bicep install --version $(bicepVersion)
              az bicep version
              az bicep build --file "$(Build.Repository.LocalPath)/monitoring/alerts.bicep" --stdout > /dev/null
            displayName: az bicep build monitoring/alerts.bicep

  # ===================================================================================
  # The same package, first to dev, then - after approval - to prod.
  - template: cicd/templates/deploy-environment.yml
    parameters:
      env: dev
      dependsOn: build
      serviceConnection: ${{ variables.devServiceConnection }}

  - template: cicd/templates/deploy-environment.yml
    parameters:
      env: prod
      dependsOn: deploy_dev
      serviceConnection: ${{ variables.prodServiceConnection }}
